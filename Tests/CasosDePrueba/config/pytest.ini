[pytest]
# Configuración de pytest para tests de Casos de Prueba

# Patrones de búsqueda de archivos de test
python_files = test_*.py

# Patrones de búsqueda de clases de test
python_classes = Test*

# Patrones de búsqueda de funciones de test
python_functions = test_*

# Directorio base para los tests
testpaths = .

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers personalizados
markers =
    cp01: Tests de Registro de Usuarios
    cp02: Tests de Autenticación y Autorización
    cp03: Tests de Gestión de Eventos
    cp04: Tests de Gestión de Tickets y Tarifas
    cp05: Tests de Proceso de Compra
    cp06: Tests de Validación de Tickets
    cp07: Tests de Reportes y Consultas
    cp08: Tests de Integración E2E
    slow: Tests que tardan más tiempo
    requires_db: Tests que requieren base de datos
    integration: Tests de integración

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuración de timeouts (requiere pytest-timeout)
# timeout = 300

# Configuración de coverage (si se usa pytest-cov)
# [coverage:run]
# source = ../Backend
# omit = 
#     */tests/*
#     */conftest.py
#     */__pycache__/*
