name: Backend CI/CD

on: []  # disabled

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-html
    
    - name: Create .env for tests
      run: |
        cat > .env << EOF
        DB_HOST=${{ secrets.DB_HOST }}
        DB_NAME=${{ secrets.DB_NAME }}
        DB_USER=${{ secrets.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_PORT=${{ secrets.DB_PORT }}
        GOOGLE_CLIENT_ID=mock-test-client-id
        GOOGLE_CLIENT_SECRET=mock-test-secret
        GOOGLE_REDIRECT_URL=https://testserver/callback
        CLOUD_NAME=${{ secrets.CLOUD_NAME }}
        CLOUD_API_KEY=${{ secrets.CLOUD_API_KEY }}
        CLOUD_API_SECRET=${{ secrets.CLOUD_API_SECRET }}
        EOF
    
    - name: Run tests
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_PORT: ${{ secrets.DB_PORT }}
        CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
        CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
        CLOUD_API_SECRET: ${{ secrets.CLOUD_API_SECRET }}
      run: |
        pytest --html=test-results.html --self-contained-html
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: Backend/test-results.html

