name: E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running E2E tests"
        required: false
        default: "Manual test run"

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tickify_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/tickify-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tickify_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickify_test
        working-directory: ./Backend
        run: python tests/seed_e2e_data.py

      - name: Start backend
        working-directory: ./Backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tickify_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickify_test
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && echo "✅ Backend ready" && break
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: ./Frontend/tickify-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./Frontend/tickify-frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: ./Frontend/tickify-frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          nohup npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:5173 && echo "✅ Frontend ready" && break
            echo "⏳ Waiting for frontend... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: ./Frontend/tickify-frontend
        run: npm run test:e2e:ci
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Frontend/tickify-frontend/playwright-report/
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ===" && cat Backend/backend.log || true
          echo "=== Frontend Logs ===" && cat Frontend/tickify-frontend/frontend.log || true

      - name: Stop services
        if: always()
        run: |
          kill $(cat Backend/backend.pid) || true
          kill $(cat Frontend/tickify-frontend/frontend.pid) || true
